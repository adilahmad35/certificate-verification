<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate Verification | Northbridge Learning Academy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="brand">NORTHBRIDGE LEARNING ACADEMY</div>
      <h1>Certificate Verification</h1>
      <p class="subtitle">Enter the certificate ID to verify its details.</p>

      <form id="verifyForm">
        <input id="certificateId" type="text" placeholder="e.g. NBLA-2026-001"
               autocomplete="off" required>
        <button type="submit">Verify Certificate</button>
      </form>

      <div id="result" class="result hidden"></div>
    </section>
  </main>

  <script>
    const certificate = {
      id: "NBLA-2026-001",
      name: "Adil Ahmad",
      title: "UI/UX Design Internship",
      organization: "Northbridge Learning Academy",
      duration: "10/06/2026 – 10/08/2026",
      issued: "20/08/2026"
    };

    const form = document.getElementById("verifyForm");
    const input = document.getElementById("certificateId");
    const result = document.getElementById("result");

    function showResult(valid) {
      if (valid) {
        result.className = "result valid";
        result.innerHTML = `
          <div class="icon">✓</div>
          <h2>Certificate Verified</h2>
          <p class="status">VALID CERTIFICATE</p>
          <div class="details">
            <div><span>Recipient</span><strong>${certificate.name}</strong></div>
            <div><span>Certificate</span><strong>${certificate.title}</strong></div>
            <div><span>Institution</span><strong>${certificate.organization}</strong></div>
            <div><span>Duration</span><strong>${certificate.duration}</strong></div>
            <div><span>Certificate ID</span><strong>${certificate.id}</strong></div>
            <div><span>Issued</span><strong>${certificate.issued}</strong></div>
          </div>`;
      } else {
        result.className = "result invalid";
        result.innerHTML = `
          <div class="icon">✕</div>
          <h2>Certificate Not Found</h2>
          <p>The certificate ID entered could not be verified.</p>`;
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const id = input.value.trim().toUpperCase();
      showResult(id === certificate.id);
    });

    const params = new URLSearchParams(window.location.search);
    const qrId = params.get("id");
    if (qrId) {
      input.value = qrId;
      showResult(qrId.trim().toUpperCase() === certificate.id);
    }
  </script>
</body>
</html>
